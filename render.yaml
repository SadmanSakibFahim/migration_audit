services:
  - type: web
    name: albatross-pro
    runtime: python
    buildCommand: |
      git submodule set-url albatross_docs https://x-access-token:${GITHUB_TOKEN}@github.com/SadmanSakibFahim/albatross_pro.git
      git submodule set-url albatross_pro https://x-access-token:${GITHUB_TOKEN}@github.com/SadmanSakibFahim/albatross_pro.git
      git submodule update --init --recursive
      pip install -r requirements.txt
    startCommand: "gunicorn -c gunicorn.conf.py albatross_pro.web.app:app"
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: AUTH_DB_URI
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
