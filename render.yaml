services:
  - type: web
    name: albatross-pro
    runtime: python
    buildCommand: |
      git config --global credential.helper store
      echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
      git submodule update --init --recursive
      pip install -r requirements.txt
    startCommand: "gunicorn -c gunicorn.conf.py albatross_pro.web.app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        sync: false
      - key: AUTH_DB_URI
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
