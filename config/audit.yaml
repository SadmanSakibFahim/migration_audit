# This is the config file that defines which tables to audit and the tolerances for the checks.
# Goal: This is the only file that should need to be edited to set up an audit for a new migration.

tables:
  users:
    source: data/source/users.csv
    target: data/target/users.csv
    primary_key: id
    aggregates:
      - age
      - tenure_days
    data_constraints:
      first_name: [not_null]
      last_name: [not_null]
      email: [not_null]
      date_of_birth: 
        - not_null
        - date
      date_onboarded: 
        - date
        - not_null
    mappings:
      - columns: [status]
        allowed_values: [active, inactive, suspended, pending]
      - columns: [country_code]
        allowed_values: [US, CA, UK, AU, DE, FR, JP, CN]
    relationships: []

  orders:
    source: data/source/orders.csv
    target: data/target/orders.csv
    primary_key: id
    aggregates:
      - amount
      - quantity
    data_constraints:
      order_date: 
        - date
        - not_null
      amount: [not_null]
      user_id: [not_null]
    mappings:
      - columns: [order_status]
        allowed_values: [pending, processing, shipped, delivered, cancelled, refunded]
      - columns: [payment_method]
        allowed_values: [credit_card, debit_card, paypal, bank_transfer, check]
    relationships:
      - child:
          target: data/target/orders.csv
          fk_column: user_id
        parent:
          target: data/target/users.csv
          pk_column: id
      - child:
          target: data/target/order_items.csv
          fk_column: order_id
        parent:
          target: data/target/orders.csv
          pk_column: id

  order_items:
    source: data/source/order_items.csv
    target: data/target/order_items.csv
    primary_key: id
    aggregates:
      - price
      - quantity
    data_constraints:
      order_id: [not_null]
      product_id: [not_null]
      quantity: [not_null]
      price: [not_null]
    mappings:
      - columns: [fulfillment_status]
        allowed_values: [pending, fulfilled, backorder, cancelled]
    relationships:
      - child:
          target: data/target/order_items.csv
          fk_column: order_id
        parent:
          target: data/target/orders.csv
          pk_column: id
      - child:
          target: data/target/order_items.csv
          fk_column: product_id
        parent:
          target: data/target/products.csv
          pk_column: id

  products:
    source: data/source/products.csv
    target: data/target/products.csv
    primary_key: id
    aggregates:
      - price
      - stock_quantity
    data_constraints:
      product_name: [not_null]
      price: [not_null]
      stock_quantity: [not_null]
    mappings:
      - columns: [category]
        allowed_values: [electronics, clothing, books, home, sports, toys, other]
      - columns: [status]
        allowed_values: [active, discontinued, coming_soon]

tolerances:
  volume_loss_pct: 0.1
  aggregate_pct_diff: 1.0

logging:
  level: DEBUG
  file: logs/audit.log