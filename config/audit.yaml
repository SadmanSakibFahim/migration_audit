# Complex Mapping Audit Configuration
# This config demonstrates N:1, 1:N, and N:M table mappings

tables:
  # Example 1: N:1 Mapping - Multiple source tables (orders_2023, orders_2024)
  # merge into one target table (orders_consolidated)
  orders_consolidated:
    complex_mapping:
      mapping_type: "N:1"
      aggregation_strategy: "merge" # Options: sum, count, merge, first, last
      sources:
        - path: test_data/source/orders_2023.csv
          primary_key: id
        - path: test_data/source/orders_2024.csv
          primary_key: id
      targets:
        - path: test_data/target/orders_consolidated.csv
          primary_key: id
    primary_key: id
    aggregates:
      - amount
      - quantity
    data_constraints:
      order_date:
        - not_null
        - date
      amount: [not_null]
      user_id: [not_null]
    mappings:
      - columns: [order_status]
        allowed_values:
          [pending, processing, shipped, delivered, cancelled, refunded]
    relationships: []

  # Example 2: 1:N Mapping - One source table (customers) splits into
  # multiple target tables (customers_active, customers_inactive)
  customers_split:
    complex_mapping:
      mapping_type: "1:N"
      split_strategy: "filter" # Options: copy, distribute, filter
      sources:
        - path: test_data/source/customers.csv
          primary_key: id
      targets:
        - path: test_data/target/customers_active.csv
          primary_key: id
        - path: test_data/target/customers_inactive.csv
          primary_key: id
    primary_key: id
    aggregates:
      - balance
    data_constraints:
      email: [not_null]
      registration_date:
        - not_null
        - date
    mappings:
      - columns: [status]
        allowed_values: [active, inactive, suspended, pending]
    relationships: []

  # Example 3: N:1 Mapping - Multiple product source tables (electronics, clothing)
  # merge into one unified products table
  products_unified:
    complex_mapping:
      mapping_type: "N:1"
      aggregation_strategy: "merge"
      sources:
        - path: test_data/source/products_electronics.csv
          primary_key: id
        - path: test_data/source/products_clothing.csv
          primary_key: id
      targets:
        - path: test_data/target/products_unified.csv
          primary_key: id
    primary_key: id
    aggregates:
      - price
      - stock_quantity
    data_constraints:
      product_name: [not_null]
      price: [not_null]
      stock_quantity: [not_null]
    mappings:
      - columns: [category]
        allowed_values:
          [electronics, clothing, books, home, sports, toys, other]
    relationships: []

tolerances:
  volume_loss_pct: 0.1
  aggregate_pct_diff: 1.0

logging:
  level: DEBUG
  file: logs/audit.log
