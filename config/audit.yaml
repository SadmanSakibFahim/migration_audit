tables:
  orders:
    source: random_data/source/orders.csv
    target: random_data/target/orders.csv
    primary_key: id
    volume_tolerance: 0.1
    aggregate_tolerance: 1.0
    identity_overlap_threshold: 95
    string_columns:
    - column: product_name
      max_length: 255
      check_whitespace: true
      check_encoding: true
    - column: description
      max_length: 500
      check_whitespace: false
      check_encoding: true
    enum_columns:
    - column: status
      mapping:
        NEW: NEW
        PROCESSING: PROCESSING
        SHIPPED: SHIPPED
        DELIVERED: DELIVERED
        CANCELLED: CANCELLED
      check_distribution: true
      distribution_tolerance_pct: 0.05
    - column: payment_method
      mapping:
        CARD: CARD
        BANK: BANK
        PAYPAL: PAYPAL
        CRYPTO: CRYPTO
      check_distribution: false
    boolean_columns:
    - column: is_premium
      true_values:
      - 'true'
      - '1'
      - Y
      - 'yes'
      false_values:
      - 'false'
      - '0'
      - N
      - 'no'
    datetime_columns:
    - column: created_at
      expected_tz: UTC
    - column: updated_at
      expected_tz: null
    null_sentinels:
    - column: customer_notes
      sentinels:
      - ''
      - N/A
      - '-'
      - 'null'
      - NO DATA
    - column: internal_notes
      sentinels:
      - ''
    numeric_precision_columns:
    - column: discount_rate
      expected_precision: 5
      expected_scale: 4
    - column: price_usd
      expected_precision: 8
      expected_scale: 2
    aggregates:
    - subtotal
    - price_usd
    - quantity
    unique_columns:
    - transaction_hash
    data_constraints:
      quantity:
      - positive
      discount_rate:
      - between_0_1
      customer_id:
      - not_null
    mappings:
    - columns:
      - status
      allowed_values:
      - NEW
      - PROCESSING
      - SHIPPED
      - DELIVERED
      - CANCELLED
    relationships:
    - child:
        table: orders
        fk_column: customer_id
      parent:
        table: customers
        pk_column: id
        target: random_data/target/customers.csv
    - child:
        table: orders
        fk_column: warehouse_id
      parent:
        table: warehouses
        pk_column: id
        target: random_data/target/warehouses.csv
